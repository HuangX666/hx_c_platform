# First-party configuration overlay; upstream source stays unchanged.
# Distinct SONAMEs avoid Android system BoringSSL/native-bridge collisions.
my %targets = (
    "hx-android-arm" => {
        inherit_from => [ "android-arm" ],
        shlib_variant => "-hx",
    },
    "hx-android-arm64" => {
        inherit_from => [ "android-arm64" ],
        shlib_variant => "-hx",
    },
    "hx-android-x86_64" => {
        inherit_from => [ "android-x86_64" ],
        shlib_variant => "-hx",
    },
);
