name: C platform contracts
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-14]
        shared: [ON, OFF]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
      - name: Build native dependency SDK (POSIX)
        if: runner.os != 'Windows'
        run: |
          cmake -S tools/dependencies -B build-deps
          cmake --build build-deps --parallel 2
      - name: Build native dependency SDK (MSVC)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -S tools/dependencies -B build-deps -G "Visual Studio 17 2022" -A x64 -DHX_DEPS_OPENSSL_ASM=OFF
          if errorlevel 1 exit /b 1
          cmake --build build-deps --config Release --parallel 2
      - run: python3 tools/fetch_iconv.py
        if: runner.os != 'Windows'
      - run: python tools/fetch_iconv.py
        if: runner.os == 'Windows'
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          -DHX_OS_DEPENDENCY_PREFIX="${{ github.workspace }}/build-deps/prefix"
          -DHX_OS_ENABLE_ICONV=ON
          -DHX_OS_ICONV_SOURCE_DIR="${{ github.workspace }}/deps/.cache/libiconv-1.18"
      - run: cmake --build build --config Release --parallel 4
      - run: ctest --test-dir build -C Release --output-on-failure
      - run: python3 tools/verify_install.py build --config Release
        if: runner.os != 'Windows'
      - run: python tools/verify_install.py build --config Release
        if: runner.os == 'Windows'

  parser_backends:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python tools/fetch_parsers.py
      - name: Configure optional parsers
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=ON
          -DHX_OS_ENABLE_CRYPTO=OFF
          -DHX_OS_ENABLE_CJSON=ON
          -DHX_OS_CJSON_SOURCE_DIR=deps/.cache/cJSON-1.7.19
          -DHX_OS_ENABLE_LIBYAML=ON
          -DHX_OS_LIBYAML_SOURCE_DIR=deps/.cache/libyaml-0.2.5
          -DHX_OS_ENABLE_MINIXML=ON
          -DHX_OS_MINIXML_SOURCE_DIR=deps/.cache/mxml-4.0.6
          -DHX_OS_ENABLE_INIH=ON
          -DHX_OS_INIH_SOURCE_DIR=deps/.cache/inih-r62
          -DHX_OS_ENABLE_TOMLC=ON
          -DHX_OS_TOMLC_SOURCE_DIR=deps/.cache/tomlc17-R260821
      - run: cmake --build build --config Release --parallel 4
      - run: ctest --test-dir build -C Release --output-on-failure
      - run: python tools/verify_install.py build --config Release


  minimal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: >-
          cmake -C cmake/minimal.cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release -DHX_OS_BUILD_TESTS=ON
          -DBUILD_SHARED_LIBS=ON
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        sanitizer: ["address,undefined", "thread"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
      - name: Prepare OpenSSL and archive SDK
        run: |
          cmake -S tools/dependencies -B build-deps
          cmake --build build-deps --parallel 2
      - run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DHX_OS_SANITIZER=${{ matrix.sanitizer }}
          -DHX_OS_DEPENDENCY_PREFIX="${{ github.workspace }}/build-deps/prefix"
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure

  musl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run native musl contracts
        run: |
          docker run --rm -v "$PWD:/src:ro" alpine:3.22 sh -ec '
            apk add --no-cache build-base cmake
            cmake -S /src -B /tmp/build -DCMAKE_BUILD_TYPE=Release \
              -DHX_OS_ENABLE_CRYPTO=OFF
            cmake --build /tmp/build --parallel 4
            ctest --test-dir /tmp/build --output-on-failure
          '

  arm_linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - processor: aarch64
            triplet: aarch64-linux-gnu
            emulator: qemu-aarch64
            exclude: '^process$'
          - processor: armv7
            triplet: arm-linux-gnueabihf
            emulator: qemu-arm
            exclude: '^process$|^sysinfo$'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install cross compiler and emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-${{ matrix.triplet }} \
            g++-${{ matrix.triplet }} qemu-user
      - name: Configure SDK contract build
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/embedded-linux.cmake
          -DHX_OS_TARGET_PROCESSOR=${{ matrix.processor }}
          -DHX_OS_CROSS_PREFIX=${{ matrix.triplet }}-
          -DHX_OS_SYSROOT=/
          -DHX_OS_ENABLE_CRYPTO=OFF
          -DCMAKE_CROSSCOMPILING_EMULATOR="${{ matrix.emulator
          }};-L;/usr/${{ matrix.triplet }}"
      - run: cmake --build build --parallel 4
      # QEMU syscall translation does not preserve spawn-error reporting
      # or 32-bit sysinfo memory totals. Native board tests must include both.
      - name: Run QEMU-compatible contracts (not board acceptance)
        env:
          QEMU_LD_PREFIX: /usr/${{ matrix.triplet }}
        run: >-
          ctest --test-dir build --output-on-failure
          -E '${{ matrix.exclude }}'

  android:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
        api: [21, 28]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned Android NDK
        run: sdkmanager "ndk;28.2.13676358"
      - name: Build Android C99 and C++11 contracts
        run: >-
          python3 tools/verify_android.py
          --ndk "$ANDROID_HOME/ndk/28.2.13676358"
          --abi ${{ matrix.abi }} --api ${{ matrix.api }}
      - name: Build minimal Android profile
        if: matrix.api == 21
        run: >-
          python3 tools/verify_android.py
          --ndk "$ANDROID_HOME/ndk/28.2.13676358"
          --abi ${{ matrix.abi }} --api 21 --minimal
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-${{ matrix.abi }}-api${{ matrix.api }}
          path: |
            build-android/*.json
            build-android/*/*.log

  independent_procedures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: >-
          cmake -S . -B build -C cmake/minimal.cmake
          -DHX_OS_ENABLE_PROCEDURES=ON -DHX_OS_BUILD_TESTS=ON
          -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure

  independent_variant:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: >-
          cmake -S . -B build -C cmake/minimal.cmake
          -DHX_OS_ENABLE_VARIANT=ON -DHX_OS_BUILD_TESTS=ON
          -DHX_OS_BUILD_EXAMPLES=ON -DBUILD_SHARED_LIBS=ON
          -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure
